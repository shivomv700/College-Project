
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1456a0">
<title>Admin Responses | Government Polytechnic Garhi Shyampur</title>

<style>
:root {
  color-scheme: light;
  --blue: #1456a0;
  --dark: #103f78;
  --ink: #18324e;
  --muted: #647890;
  --line: #d8e4f1;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 32px 18px;
  background-color: #eaf3ff;
  background-image:
    linear-gradient(145deg, #eaf3ff66, #f8fbff55, #e4efff66),
    url("./Background.jpeg");
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Segoe UI", Arial, sans-serif;
}

main {
  width: min(100%, 980px);
  margin: 0 auto;
  padding: 30px;
  border: 1px solid #dce8f5;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 18px 50px #1747791a;
}

.login-panel {
  width: min(100%, 430px);
  margin: 8vh auto;
  padding: 32px;
}
.login-brand, .brand {
  display: flex;
  align-items: center;
  gap: 15px;
}
.login-brand { margin-bottom: 24px; }
.login-logo, .logo {
  width: 68px;
  height: 68px;
  padding: 4px;
  flex: 0 0 68px;
  border-radius: 50%;
  background: white;
  object-fit: contain;
}
.login-brand h1 { color: var(--dark); font-size: 1.4rem; }
.login-brand p { color: var(--muted); font-size: .9rem; }

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: 650;
  font-size: .9rem;
}
input, select {
  width: 100%;
  min-height: 43px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: var(--ink);
  font: inherit;
}
input:focus, select:focus {
  outline: 3px solid #4386d21c;
  border-color: #4386d2;
}
button {
  min-height: 40px;
  padding: 0 14px;
  border: 0;
  border-radius: 8px;
  background: var(--blue);
  color: white;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
button:hover { background: var(--dark); }
button:disabled { opacity: .55; cursor: wait; }
.secondary { background: #e8f1fb; color: var(--dark); }
.secondary:hover { background: #d6e7f8; }
.danger { background: #a8323c; }
.danger:hover { background: #852730; }
.login-submit { width: 100%; margin-top: 20px; }
#loginMessage { color: #a8323c; min-height: 1.3em; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px;
  border-radius: 12px;
  color: white;
  background: linear-gradient(120deg, var(--dark), #2674c8);
}
.eyebrow {
  margin: 0 0 7px;
  color: #d8eaff;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 1.9rem); }
header p:last-child { margin: 8px 0 0; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 14px;
}
#count { color: var(--muted); }
.actions, .response-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.filters {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 17px;
}
.filters label { color: var(--muted); }
#status { min-height: 1.4em; color: #8b2730; }
#responses { display: grid; gap: 12px; }
.group { display: grid; gap: 10px; }
.group-title {
  margin: 8px 0 0;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--line);
  color: var(--dark);
  font-size: 1.05rem;
}
.response { padding: 17px; border: 1px solid var(--line); border-radius: 11px; }
.response-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
  margin-bottom: 13px;
}
.response h2 { margin: 0; color: var(--dark); font-size: 1.05rem; }
.date { margin: 5px 0 0; color: var(--muted); font-size: .83rem; }
.delete-one { background: #fff0f0; color: #8b2730; }
.print-one { background: #e8f1fb; color: var(--dark); }
dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px 18px; margin: 0; }
dt { color: var(--muted); font-size: .78rem; }
dd { margin: 4px 0 0; overflow-wrap: anywhere; }
.feedback { grid-column: 1 / -1; }
.rating-1 dd { color: #d94a4a; }
.rating-2 dd { color: #ef7d32; }
.rating-3 dd { color: #d9a915; }
.rating-4 dd { color: #78a92e; }
.rating-5 dd { color: #168a58; }
.empty { padding: 30px 15px; border: 1px dashed #b9cbe0; border-radius: 10px; color: var(--muted); text-align: center; }

@media (max-width: 620px) {
  body { padding: 12px; }
  main { padding: 16px; }
  .filters, dl { grid-template-columns: 1fr; }
  .response-head { flex-direction: column; }
  .feedback { grid-column: auto; }
  .logo, .login-logo { width: 56px; height: 56px; flex-basis: 56px; }
}
@media print {
  body { padding: 0; background: white; }
  main { width: 100%; padding: 0; border: 0; box-shadow: none; }
  .toolbar, .filters, #status, .response-actions { display: none !important; }
  header { print-color-adjust: exact; }
  .response { break-inside: avoid; }
}
</style>
</head>

<body>
<main>
  <section id="loginPanel" class="login-panel" hidden>
    <div class="login-brand">
      <img class="login-logo" src="./Logo.jpg" alt="College logo">
      <div>
        <h1>Admin sign in</h1>
        <p>Government Polytechnic Garhi Shyampur</p>
      </div>
    </div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
      <button class="login-submit" id="loginButton" type="submit">Sign in</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="adminContent" hidden>
    <header>
      <div class="brand">
        <img class="logo" src="./Logo.jpg" alt="College logo">
        <div>
          <p class="eyebrow">Uttarakhand Polytechnic College · Garhi Shyampur</p>
          <h1>Admin · Student Feedback</h1>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <p id="count">Loading responses…</p>
      <div class="actions">
        <button class="secondary" id="refresh" type="button">Refresh</button>
        <button class="secondary" id="export" type="button">Export CSV</button>
        <button class="secondary" id="exportPdf" type="button">Print / Save PDF</button>
        <button class="danger" id="deleteAll" type="button">Delete all</button>
        <button class="secondary" id="logout" type="button">Log out</button>
      </div>
    </div>

    <div class="filters">
      <label>Branch
        <select id="branchFilter">
          <option value="">All branches</option>
          <option>Computer Science Engineering</option>
          <option>Civil Engineering</option>
          <option>Electrical Engineering</option>
        </select>
      </label>
      <label>Semester
        <select id="semesterFilter">
          <option value="">All semesters</option>
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
        </select>
      </label>
      <label>Roll number
        <input id="rollFilter" type="search" placeholder="Search roll number">
      </label>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="responses" aria-label="Feedback responses"></section>
  </section>
</main>

<script>
"use strict";

const API_BASE = "https://college-project-wdh5.onrender.com";

const $ = id => document.getElementById(id);
const list = $("responses");
const count = $("count");
const statusMessage = $("status");
const loginPanel = $("loginPanel");
const adminContent = $("adminContent");
const loginForm = $("loginForm");
const loginMessage = $("loginMessage");
const branchFilter = $("branchFilter");
const semesterFilter = $("semesterFilter");
const rollFilter = $("rollFilter");

let records = [];
let loading = false;

// All requests use the Render backend and include cross-origin credentials.
async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  if (options.body && !headers.has("Content-Type")) {
    headers.set("Content-Type", "application/json");
  }

  let response;
  try {
    response = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers,
      credentials: "include",
      cache: "no-store"
    });
  } catch {
    throw new Error("Cannot reach the backend. Check the Render deployment and connection.");
  }

  const text = await response.text();
  let data = {};

  if (text.trim()) {
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(`The server returned a non-JSON response (HTTP ${response.status}).`);
    }
  }

  if (!response.ok) {
    if (response.status === 401) {
      throw new Error(data.error || "Your admin session is not authenticated. Please sign in again.");
    }
    throw new Error(data.error || data.message || `Request failed (HTTP ${response.status}).`);
  }

  return data;
}

function showLogin(message = "") {
  loginPanel.hidden = false;
  adminContent.hidden = true;
  loginMessage.textContent = message;
}

function showAdmin() {
  loginPanel.hidden = true;
  adminContent.hidden = false;
}

function addDetail(container, label, value, className = "") {
  const wrapper = document.createElement("div");
  if (className) wrapper.className = className;
  const term = document.createElement("dt");
  term.textContent = label;
  const description = document.createElement("dd");
  description.textContent = value == null || value === "" ? "—" : String(value);
  wrapper.append(term, description);
  container.append(wrapper);
}

function render() {
  list.replaceChildren();

  const branch = branchFilter.value;
  const semester = semesterFilter.value;
  const roll = rollFilter.value.trim();

  const filtered = records.filter(record =>
    (!branch || record.branch === branch) &&
    (!semester || String(record.semester) === semester) &&
    (!roll || String(record.rollNumber || "").includes(roll))
  ).sort((a, b) =>
    String(a.branch || "").localeCompare(String(b.branch || "")) ||
    Number(a.semester || 0) - Number(b.semester || 0) ||
    String(a.rollNumber || "").localeCompare(String(b.rollNumber || ""))
  );

  count.textContent = `${filtered.length} of ${records.length} response${records.length === 1 ? "" : "s"}`;

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = records.length
      ? "No responses match these filters."
      : "No feedback has been submitted yet.";
    list.append(empty);
    return;
  }

  const groups = new Map();
  for (const record of filtered) {
    const key = `${record.branch || "Unspecified branch"} · Semester ${record.semester || "—"}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(record);
  }

  for (const [groupName, groupRecords] of groups) {
    const group = document.createElement("section");
    group.className = "group";

    const title = document.createElement("h2");
    title.className = "group-title";
    title.textContent = `${groupName} · ${groupRecords.length} response${groupRecords.length === 1 ? "" : "s"}`;
    group.append(title);

    for (const record of groupRecords) {
      const article = document.createElement("article");
      article.className = "response";

      const heading = document.createElement("div");
      heading.className = "response-head";

      const student = document.createElement("div");
      const name = document.createElement("h2");
      name.textContent = record.studentName || "Unnamed student";

      const date = document.createElement("p");
      date.className = "date";
      date.textContent = record.submittedAt
        ? new Date(record.submittedAt).toLocaleString()
        : "Submission time unavailable";

      student.append(name, date);

      const actions = document.createElement("div");
      actions.className = "response-actions";

      const print = document.createElement("button");
      print.className = "print-one";
      print.type = "button";
      print.textContent = "Print response";
      print.addEventListener("click", () => window.print());

      const remove = document.createElement("button");
      remove.className = "delete-one";
      remove.type = "button";
      remove.textContent = "Delete";
      remove.addEventListener("click", async () => {
        if (!confirm("Delete this feedback response?")) return;
        try {
          await api(`/api/responses/${encodeURIComponent(record.id)}`, {
            method: "DELETE"
          });
          await loadResponses();
          statusMessage.textContent = "Response deleted.";
        } catch (error) {
          statusMessage.textContent = error.message;
        }
      });

      actions.append(print, remove);
      heading.append(student, actions);

      const details = document.createElement("dl");
      addDetail(details, "Branch", record.branch);
      addDetail(details, "Semester", record.semester);
      const years = { "1": "1st year", "2": "2nd year", "3": "3rd year" };
      addDetail(details, "College year", years[String(record.collegeYear)] || record.collegeYear);
      addDetail(details, "Email", record.email);
      addDetail(details, "Date of birth", record.dob);
      addDetail(details, "Roll number", record.rollNumber);

      if (record.ratings && typeof record.ratings === "object") {
        for (const [topic, rawRating] of Object.entries(record.ratings)) {
          const rating = Number(rawRating);
          const value = Number.isFinite(rating)
            ? `${"★".repeat(Math.max(0, Math.min(5, rating)))} ${rating} / 5`
            : String(rawRating);
          addDetail(details, topic, value, Number.isFinite(rating) ? `rating-${rating}` : "");
        }
      }

      if (record.feedback) {
        addDetail(details, "Feedback", record.feedback, "feedback");
      }

      article.append(heading, details);
      group.append(article);
    }

    list.append(group);
  }
}

async function loadResponses() {
  if (loading) return;
  loading = true;
  statusMessage.textContent = "";

  try {
    const data = await api("/api/responses");
    if (!Array.isArray(data)) {
      throw new Error("Unexpected response format: the server did not return a response list.");
    }
    records = data.sort((a, b) =>
      new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0)
    );
    render();
  } catch (error) {
    count.textContent = "Could not load responses";
    statusMessage.textContent = error.message;
    if (/unauthorized|sign in|session/i.test(error.message)) {
      showLogin("Your session expired or wasn't saved. Please sign in again.");
    }
  } finally {
    loading = false;
  }
}

loginForm.addEventListener("submit", async event => {
  event.preventDefault();
  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "Signing in…";
  loginMessage.textContent = "";

  try {
    const result = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({
        username: loginForm.elements.username.value.trim(),
        password: loginForm.elements.password.value
      })
    });

    if (!result.authenticated) {
      throw new Error("The server did not confirm authentication.");
    }

    // Verify that the cookie-backed session is actually recognized.
    const session = await api("/api/auth");
    if (!session.authenticated) {
      throw new Error("Login succeeded, but the session cookie was not recognized. Check browser cookie settings and the backend Set-Cookie header.");
    }

    loginForm.reset();
    showAdmin();
    await loadResponses();
  } catch (error) {
    showLogin(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Sign in";
  }
});

$("logout").addEventListener("click", async () => {
  try {
    await api("/api/auth/logout", { method: "POST" });
    records = [];
    list.replaceChildren();
    showLogin("You have signed out.");
  } catch (error) {
    statusMessage.textContent = error.message;
  }
});

$("refresh").addEventListener("click", loadResponses);
branchFilter.addEventListener("change", render);
semesterFilter.addEventListener("change", render);
rollFilter.addEventListener("input", render);

$("deleteAll").addEventListener("click", async () => {
  if (!records.length || !confirm("Permanently delete all saved feedback?")) return;
  try {
    await api("/api/responses", { method: "DELETE" });
    await loadResponses();
    statusMessage.textContent = "All responses deleted.";
  } catch (error) {
    statusMessage.textContent = error.message;
  }
});

$("exportPdf").addEventListener("click", () => {
  if (!records.length) {
    statusMessage.textContent = "There are no responses to print.";
    return;
  }
  window.print();
});

$("export").addEventListener("click", () => {
  if (!records.length) {
    statusMessage.textContent = "There are no responses to export.";
    return;
  }

  const topics = [...new Set(records.flatMap(record =>
    Object.keys(record.ratings || {})
  ))];

  const columns = [
    "Student name", "Branch", "Semester", "College year",
    "Email", "Date of birth", "Roll number",
    ...topics, "Feedback", "Submitted at"
  ];

  const values = record => [
    record.studentName, record.branch, record.semester,
    record.collegeYear, record.email, record.dob,
    record.rollNumber,
    ...topics.map(topic => record.ratings?.[topic] ?? ""),
    record.feedback || "", record.submittedAt
  ];

  const cell = value => {
    let text = String(value ?? "");
    // Prevent spreadsheet formula execution for untrusted text.
    if (/^[\s]*[=+\-@]/.test(text)) text = "'" + text;
    return `"${text.replace(/"/g, '""')}"`;
  };

  const csv = [columns, ...records.map(values)]
    .map(row => row.map(cell).join(","))
    .join("\r\n");

  const url = URL.createObjectURL(
    new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" })
  );

  const link = document.createElement("a");
  link.href = url;
  link.download = "student-feedback.csv";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

// Start by checking the existing session.
(async function init() {
  try {
    const session = await api("/api/auth");
    if (session.authenticated) {
      showAdmin();
      await loadResponses();
    } else {
      showLogin();
    }
  } catch (error) {
    showLogin("Cannot verify your session: " + error.message);
  }
})();
</script>
</body>
</html>
