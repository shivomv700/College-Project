
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1456a0">
  <title>Admin Dashboard | College Feedback</title>

  <style>
    :root {
      --blue: #1456a0;
      --dark: #103f78;
      --ink: #18324e;
      --muted: #647890;
      --line: #d8e4f1;
      --bg: #f1f6fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 40px #163b6410;
    }

    [hidden] { display: none !important; }

    h1, h2, p { overflow-wrap: anywhere; }

    h1 { margin: 0; font-size: 1.7rem; }
    h2 { font-size: 1.05rem; }

    .login {
      max-width: 430px;
      margin: 7vh auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
    }

    .subtitle {
      color: var(--muted);
      margin: 6px 0 0;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
      font-size: .9rem;
    }

    input, select {
      width: 100%;
      min-height: 43px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: white;
      color: var(--ink);
    }

    input:focus, select:focus {
      outline: 2px solid #1456a044;
      border-color: var(--blue);
    }

    button {
      min-height: 40px;
      padding: 9px 13px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--dark); }
    button:disabled { opacity: .6; cursor: wait; }

    .full { width: 100%; margin-top: 20px; }

    .secondary {
      background: #e8f1fb;
      color: var(--dark);
    }

    .secondary:hover { background: #d6e7f8; }

    .danger { background: #a8323c; }
    .danger:hover { background: #852730; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 16px;
    }

    .actions, .response-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .filters label { margin: 0; }

    #status, #loginMessage {
      min-height: 1.4em;
      color: #a8323c;
      overflow-wrap: anywhere;
    }

    #count { color: var(--muted); }

    .group { margin-top: 22px; }

    .group-title {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--dark);
    }

    .response {
      margin: 12px 0;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 11px;
      break-inside: avoid;
    }

    .response-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 15px;
    }

    .response-head h2 { margin: 0; color: var(--dark); }

    .date {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .83rem;
    }

    .response-actions button {
      min-height: 34px;
      padding: 7px 10px;
      font-size: .84rem;
    }

    dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px 18px;
      margin: 0;
    }

    dt { color: var(--muted); font-size: .8rem; }
    dd { margin: 4px 0 0; overflow-wrap: anywhere; }
    .wide { grid-column: 1 / -1; }

    .empty {
      padding: 28px 14px;
      border: 1px dashed #b9cbe0;
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
    }

    .note {
      margin-top: 24px;
      color: var(--muted);
      font-size: .82rem;
    }

    @media (max-width: 650px) {
      main { padding: 16px; }
      .filters, dl { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      .toolbar { align-items: flex-start; }
      h1 { font-size: 1.35rem; }
    }

    @media print {
      body { padding: 0; background: white; }
      main { max-width: none; padding: 0; border: 0; box-shadow: none; }
      .no-print, #status, #loginPanel { display: none !important; }
      .response { border: 1px solid #aaa; }
    }
  </style>
</head>

<body>
<main>

  <!-- ADMIN LOGIN -->
  <section id="loginPanel" class="login" hidden>
    <div class="brand">
      <img class="logo" src="/Logo.jpg" alt="College logo">
      <div>
        <h1>Admin Sign In</h1>
        <p class="subtitle">College Feedback System</p>
      </div>
    </div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username"
             autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password"
             type="password"
             autocomplete="current-password" required>

      <button id="loginButton" class="full" type="submit">
        Sign In
      </button>

      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- ADMIN DASHBOARD -->
  <section id="adminContent" hidden>
    <header class="brand">
      <img class="logo" src="/Logo.jpg" alt="College logo">
      <div>
        <h1>Student Feedback Dashboard</h1>
        <p class="subtitle">
          Uttarakhand Polytechnic College · Garhi Shyampur
        </p>
      </div>
    </header>

    <div class="toolbar no-print">
      <p id="count">Loading feedback...</p>

      <div class="actions">
        <button id="refresh" class="secondary">Refresh</button>
        <button id="exportCsv" class="secondary">Export CSV</button>
        <button id="printAll" class="secondary">Print / Save PDF</button>
        <button id="deleteAll" class="danger">Delete All</button>
        <button id="logout" class="secondary">Log Out</button>
      </div>
    </div>

    <div class="filters no-print">
      <label for="branchFilter">
        Branch
        <select id="branchFilter">
          <option value="">All branches</option>
          <option>Computer Science Engineering</option>
          <option>Civil Engineering</option>
          <option>Electrical Engineering</option>
        </select>
      </label>

      <label for="semesterFilter">
        Semester
        <select id="semesterFilter">
          <option value="">All semesters</option>
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
        </select>
      </label>

      <label for="rollFilter">
        Roll Number
        <input id="rollFilter" type="search"
               placeholder="Search roll number">
      </label>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="responses" aria-label="Feedback responses"></section>

    <p class="note no-print">
      Keep student information confidential. Only authorized staff should
      access, export, or delete feedback records.
    </p>
  </section>

</main>

<script>
"use strict";

/*
 * IMPORTANT:
 * All API calls go directly to Render, never to Netlify.
 */
const API_BASE = "https://college-project-wdh5.onrender.com";

const $ = (id) => document.getElementById(id);

const loginPanel = $("loginPanel");
const adminContent = $("adminContent");
const loginForm = $("loginForm");
const loginMessage = $("loginMessage");
const statusMessage = $("status");
const count = $("count");
const responseList = $("responses");

const branchFilter = $("branchFilter");
const semesterFilter = $("semesterFilter");
const rollFilter = $("rollFilter");

let records = [];
let busy = false;

/*
 * Read response text first.
 * This prevents empty responses from causing JSON parse errors.
 */
async function api(path, options = {}) {
  let response;

  try {
    response = await fetch(`${API_BASE}${path}`, {
      ...options,
      credentials: "include",
      headers: {
        ...(options.headers || {}),
        ...(options.body ? { "Content-Type": "application/json" } : {})
      }
    });
  } catch {
    throw new Error(
      "Cannot connect to Render. Check the backend deployment and CORS settings."
    );
  }

  const text = await response.text();
  let payload = {};

  if (text.trim()) {
    try {
      payload = JSON.parse(text);
    } catch {
      throw new Error(
        `The server returned an invalid response (HTTP ${response.status}).`
      );
    }
  }

  if (!response.ok) {
    throw new Error(
      payload.error ||
      payload.message ||
      `Request failed (HTTP ${response.status}).`
    );
  }

  return payload;
}

function showLogin(message = "") {
  loginPanel.hidden = false;
  adminContent.hidden = true;
  loginMessage.textContent = message;
}

function showDashboard() {
  loginPanel.hidden = true;
  adminContent.hidden = false;
  loadResponses();
}

function setStatus(message = "") {
  statusMessage.textContent = message;
}

function addDetail(container, label, value, className = "") {
  const wrapper = document.createElement("div");

  if (className) wrapper.className = className;

  const term = document.createElement("dt");
  term.textContent = label;

  const description = document.createElement("dd");
  description.textContent =
    value === undefined || value === null || value === ""
      ? "—"
      : String(value);

  wrapper.append(term, description);
  container.append(wrapper);
}

function getFilteredRecords() {
  const branch = branchFilter.value;
  const semester = semesterFilter.value;
  const roll = rollFilter.value.trim().toLowerCase();

  return records
    .filter((record) =>
      (!branch || record.branch === branch) &&
      (!semester || String(record.semester) === semester) &&
      (!roll || String(record.rollNumber || "").toLowerCase().includes(roll))
    )
    .sort((a, b) =>
      String(a.branch || "").localeCompare(String(b.branch || "")) ||
      Number(a.semester || 0) - Number(b.semester || 0) ||
      String(a.rollNumber || "").localeCompare(String(b.rollNumber || ""))
    );
}

function render() {
  responseList.replaceChildren();

  const filtered = getFilteredRecords();

  count.textContent =
    `${filtered.length} of ${records.length} feedback response(s)`;

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = records.length
      ? "No feedback matches the selected filters."
      : "No feedback has been submitted yet.";

    responseList.append(empty);
    return;
  }

  const groups = new Map();

  for (const record of filtered) {
    const key = `${record.branch || "Unknown branch"} · Semester ${record.semester || "—"}`;

    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(record);
  }

  for (const [groupName, groupRecords] of groups) {
    const group = document.createElement("section");
    group.className = "group";

    const title = document.createElement("h2");
    title.className = "group-title";
    title.textContent = `${groupName} · ${groupRecords.length} response(s)`;

    group.append(title);

    for (const record of groupRecords) {
      const article = document.createElement("article");
      article.className = "response";

      const heading = document.createElement("div");
      heading.className = "response-head";

      const student = document.createElement("div");
      const name = document.createElement("h2");
      name.textContent = record.studentName || "Unnamed student";

      const date = document.createElement("p");
      date.className = "date";

      const parsedDate = record.submittedAt
        ? new Date(record.submittedAt)
        : null;

      date.textContent =
        parsedDate && !Number.isNaN(parsedDate.getTime())
          ? parsedDate.toLocaleString()
          : "Submission time unavailable";

      student.append(name, date);

      const actions = document.createElement("div");
      actions.className = "response-actions no-print";

      const printButton = document.createElement("button");
      printButton.className = "secondary";
      printButton.textContent = "Print response";
      printButton.addEventListener("click", () => {
        window.print();
      });

      const deleteButton = document.createElement("button");
      deleteButton.className = "danger";
      deleteButton.textContent = "Delete";

      deleteButton.addEventListener("click", async () => {
        if (!confirm(`Delete feedback from ${record.studentName || "this student"}?`)) {
          return;
        }

        try {
          await api(
            `/api/responses/${encodeURIComponent(record.id)}`,
            { method: "DELETE" }
          );

          await loadResponses();
          setStatus("Feedback response deleted.");
        } catch (error) {
          setStatus(error.message);
        }
      });

      actions.append(printButton, deleteButton);
      heading.append(student, actions);

      const details = document.createElement("dl");

      addDetail(details, "Branch", record.branch);
      addDetail(details, "Semester", record.semester);
      addDetail(details, "College year", record.collegeYear);
      addDetail(details, "Email", record.email);
      addDetail(details, "Date of birth", record.dob);
      addDetail(details, "Roll number", record.rollNumber);

      if (record.ratings && typeof record.ratings === "object") {
        for (const [topic, rating] of Object.entries(record.ratings)) {
          const numericRating = Number(rating);
          const stars =
            Number.isInteger(numericRating) &&
            numericRating >= 1 &&
            numericRating <= 5
              ? "★".repeat(numericRating)
              : "";

          addDetail(
            details,
            topic,
            stars ? `${stars} ${numericRating}/5` : rating
          );
        }
      }

      if (record.feedback) {
        addDetail(details, "Additional feedback", record.feedback, "wide");
      }

      article.append(heading, details);
      group.append(article);
    }

    responseList.append(group);
  }
}

async function loadResponses() {
  if (busy) return;

  setStatus("Loading feedback...");
  busy = true;
  $("refresh").disabled = true;

  try {
    const result = await api("/api/responses");

    if (!Array.isArray(result)) {
      throw new Error("The server did not return a feedback list.");
    }

    records = result;
    render();
    setStatus("");
  } catch (error) {
    if (error.message.toLowerCase().includes("sign in")) {
      records = [];
      render();
      showLogin("Your admin session has expired. Please sign in again.");
    } else {
      setStatus(error.message);
    }
  } finally {
    busy = false;
    $("refresh").disabled = false;
  }
}

/* ADMIN LOGIN */
loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "Signing in...";
  loginMessage.textContent = "";

  try {
    await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({
        username: loginForm.elements.username.value.trim(),
        password: loginForm.elements.password.value
      })
    });

    loginForm.reset();
    showDashboard();
  } catch (error) {
    loginMessage.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Sign In";
  }
});

/* LOG OUT */
$("logout").addEventListener("click", async () => {
  try {
    await api("/api/auth/logout", { method: "POST" });

    records = [];
    render();
    showLogin("You have signed out.");
  } catch (error) {
    setStatus(error.message);
  }
});

/* FILTERS */
branchFilter.addEventListener("change", render);
semesterFilter.addEventListener("change", render);
rollFilter.addEventListener("input", render);

/* REFRESH */
$("refresh").addEventListener("click", loadResponses);

/* EXPORT FILTERED RESPONSES AS CSV */
$("exportCsv").addEventListener("click", () => {
  const filtered = getFilteredRecords();

  if (!filtered.length) {
    setStatus("There are no matching responses to export.");
    return;
  }

  const topics = [
    "Classroom cleanliness",
    "Computer lab facilities",
    "Library resources",
    "Internet connectivity",
    "Drinking water and washrooms",
    "Canteen facilities",
    "Overall College Experience",
    "Overall satisfaction rating",
    "Academic support",
    "Campus environment",
    "Extracurricular activities",
    "Student-teacher interaction"
  ];

  const columns = [
    "Student name", "Branch", "Semester", "College year",
    "Email", "Date of birth", "Roll number",
    ...topics, "Submitted at"
  ];

  const rows = filtered.map((record) => [
    record.studentName,
    record.branch,
    record.semester,
    record.collegeYear,
    record.email,
    record.dob,
    record.rollNumber,
    ...topics.map((topic) => record.ratings?.[topic] ?? ""),
    record.submittedAt
  ]);

  const cell = (value) =>
    `"${String(value ?? "").replace(/"/g, '""')}"`;

  const csv = [columns, ...rows]
    .map((row) => row.map(cell).join(","))
    .join("\r\n");

  const url = URL.createObjectURL(
    new Blob(["\uFEFF" + csv], {
      type: "text/csv;charset=utf-8"
    })
  );

  const link = document.createElement("a");
  link.href = url;
  link.download = "college-feedback.csv";
  document.body.append(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatus("CSV export created.");
});

/* PRINT OR SAVE AS PDF */
$("printAll").addEventListener("click", () => {
  if (!getFilteredRecords().length) {
    setStatus("There are no matching responses to print.");
    return;
  }

  window.print();
});

/* DELETE ALL FEEDBACK */
$("deleteAll").addEventListener("click", async () => {
  if (!records.length) {
    setStatus("There are no responses to delete.");
    return;
  }

  const confirmed = confirm(
    "Permanently delete ALL saved feedback responses? This cannot be undone."
  );

  if (!confirmed) return;

  try {
    await api("/api/responses", { method: "DELETE" });
    records = [];
    render();
    setStatus("All feedback responses were deleted.");
  } catch (error) {
    setStatus(error.message);
  }
});

/* CHECK EXISTING ADMIN SESSION */
async function initialize() {
  try {
    const session = await api("/api/auth");

    if (session.authenticated) {
      showDashboard();
    } else {
      showLogin();
    }
  } catch (error) {
    showLogin(error.message);
  }
}

initialize();
</script>
</body>
</html>
