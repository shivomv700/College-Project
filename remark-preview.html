<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1456a0">
  <title>Individual Feedback Remark · Print Preview</title>
  <style>
    :root { color-scheme: light; --blue: #1456a0; --navy: #103f78; --ink: #18324e; --muted: #647890; --line: #d8e4f1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 34px 18px 60px; background: radial-gradient(ellipse at top, #dcecff, #edf3fa 58%); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
    .toolbar { width: min(100%, 760px); margin: 0 auto 17px; display: flex; justify-content: space-between; align-items: center; gap: 14px; color: var(--muted); font-size: .9rem; }
    button { padding: 12px 18px; border: 0; border-radius: 9px; background: linear-gradient(120deg, var(--blue), #2674c8); color: white; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 5px 16px #1456a033; }
    .sheet { width: min(100%, 760px); margin: auto; overflow: hidden; border: 1px solid #dce8f5; border-radius: 16px; background: #fff; box-shadow: 0 22px 65px #17477924; }
    header { display: flex; align-items: center; gap: 19px; padding: 30px 36px; color: white; background: linear-gradient(118deg, #0c3262, #1456a0 60%, #287ac9); }
    .logo { width: 78px; height: 78px; flex: 0 0 78px; padding: 5px; border: 3px solid #ffffffbb; border-radius: 50%; background: white; object-fit: contain; }
    .eyebrow { margin: 0 0 8px; color: #d8eaff; font-size: .72rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 1.7rem; }
    header p:last-child { margin: 7px 0 0; color: #e9f3ff; }
    .content { padding: 30px 36px 34px; }
    .student { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 20px; padding: 19px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(145deg, #f8fbff, #eef6ff); }
    .detail-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: .7rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .detail-value { display: block; overflow-wrap: anywhere; font-size: .93rem; font-weight: 600; }
    .remark-label { margin: 27px 0 10px; color: var(--navy); font-size: .82rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    blockquote { position: relative; margin: 0; padding: 25px 25px 25px 30px; border: 1px solid #dce8f5; border-left: 5px solid #e1b85b; border-radius: 11px; background: #fbfdff; color: #2d4865; font-size: 1.08rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; padding-top: 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: .76rem; }
    .error { padding: 36px 20px; color: #a8323c; text-align: center; }
    @media (max-width: 600px) {
      body { padding: 12px 10px 35px; }
      header { padding: 23px 19px; align-items: flex-start; gap: 12px; }
      .logo { width: 58px; height: 58px; flex-basis: 58px; }
      h1 { font-size: 1.3rem; }
      .content { padding: 20px 17px 25px; }
      .student { grid-template-columns: 1fr; gap: 13px; padding: 15px; }
      blockquote { padding: 18px; font-size: 1rem; }
    }
    @page { size: A4; margin: 16mm; }
    @media print {
      body { min-height: auto; padding: 0; background: white; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .toolbar { display: none; }
      .sheet { width: 100%; overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
      header { padding: 22px 25px; }
      .content { padding: 26px 8px; }
      blockquote { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span>Individual remark preview · Print or save this remark as a PDF.</span>
    <button id="printRemark" type="button" hidden>Print / Save PDF</button>
  </div>
  <main class="sheet">
    <header>
      <img class="logo" src="/Logo.jpg" alt="Government Polytechnic Garhi Shyampur college logo">
      <div>
        <p class="eyebrow">Uttarakhand Polytechnic College · Garhi Shyampur</p>
        <h1>Student Feedback Remark</h1>
        <p>Individual administrative copy</p>
      </div>
    </header>
    <section class="content" id="remarkContent" aria-live="polite">
      <p class="error">Loading remark…</p>
    </section>
  </main>
  <script>
    const content = document.getElementById('remarkContent');
    const printButton = document.getElementById('printRemark');

    function addField(container, label, value) {
      const item = document.createElement('div');
      const caption = document.createElement('span');
      caption.className = 'detail-label';
      caption.textContent = label;
      const text = document.createElement('span');
      text.className = 'detail-value';
      text.textContent = value || '—';
      item.append(caption, text);
      container.append(item);
    }

    async function loadRemark() {
      try {
        const id = new URLSearchParams(location.search).get('id');
        if (!id) throw new Error('No feedback response was selected.');
        const response = await fetch(`/api/responses/${encodeURIComponent(id)}`);
        const record = await response.json();
        if (response.status === 401) throw new Error('Admin sign in is required. Open this preview from the admin panel after signing in.');
        if (!response.ok) throw new Error(record.error || 'Could not load this feedback remark.');

        content.replaceChildren();
        const details = document.createElement('div');
        details.className = 'student';
        addField(details, 'Student name', record.studentName);
        addField(details, 'Roll number', record.rollNumber);
        addField(details, 'Branch', record.branch);
        addField(details, 'Semester', record.semester ? `Semester ${record.semester}` : '');
        const yearLabels = { '1': '1st year', '2': '2nd year', '3': '3rd year' };
        addField(details, 'College year', yearLabels[String(record.collegeYear)] || record.collegeYear || '');
        addField(details, 'Email address', record.email);
        addField(details, 'Date of birth', record.dob);
        addField(details, 'Submitted', record.submittedAt ? new Date(record.submittedAt).toLocaleString() : '');

        const label = document.createElement('h2');
        label.className = 'remark-label';
        label.textContent = 'Student remark';
        const remark = document.createElement('blockquote');
        if (record.ratings) {
          remark.textContent = Object.entries(record.ratings).map(([topic, rating]) => topic + ': ' + '★'.repeat(rating) + ' ' + rating + ' / 5').join('\n');
        } else {
          remark.textContent = record.feedback || 'No remark provided.';
        }
        const footer = document.createElement('footer');
        footer.className = 'footer';
        const college = document.createElement('span');
        college.textContent = 'Uttarakhand Polytechnic College · Garhi Shyampur';
        const generated = document.createElement('span');
        generated.textContent = `Printed ${new Date().toLocaleDateString()}`;
        footer.append(college, generated);
        content.append(details, label, remark, footer);
        printButton.hidden = false;
        document.title = `Feedback Remark - ${record.studentName || 'Student'}`;
      } catch (error) {
        content.replaceChildren();
        const message = document.createElement('p');
        message.className = 'error';
        message.textContent = error.message;
        content.append(message);
      }
    }

    printButton.addEventListener('click', () => window.print());
    loadRemark();
  </script>
</body>
</html>
